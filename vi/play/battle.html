<style>:root{--display:'Dela Gothic One','Noto Sans',sans-serif;--body:'Noto Sans','M PLUS Rounded 1c',sans-serif}</style>
<style>
/* 昼の空のアリーナ：青空のグラデーション＋回る日の光＋虹＋雲＋紙ふぶき。派手さは背景に寄せ、台は白くして読みやすく。
   遊び場の対戦は明るい空だけで描く（暗い画面にはしない） */
:root{
  --night:#8fd8ff; --panel:rgba(255,255,255,.86); --line:rgba(70,50,140,.14);
  --ink:#2a1f4d; --dim:#6a5f95; --hot:#ff3d7f; --gold:#ff9d00; --cool:#0a9fd8; --off:rgba(70,50,140,.12);
  --display:'Dela Gothic One','M PLUS Rounded 1c','Noto Sans JP',sans-serif;
  --body:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;
  --num:'Oswald','Arial Narrow',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
html:not([lang="ja"]):not(.i18n-ready) body{visibility:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.app{position:relative;z-index:1;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:7px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--display);font-size:16px;filter:drop-shadow(0 1px 0 #fff) drop-shadow(0 2px 3px rgba(70,50,140,.35));letter-spacing:.04em;background:linear-gradient(90deg,var(--gold),var(--hot),var(--cool));-webkit-background-clip:text;background-clip:text;color:transparent}
.topr{display:flex;gap:6px;align-items:center}
.back{font:800 12px var(--body);color:var(--ink);text-decoration:none;background:var(--panel);border-radius:999px;padding:7px 12px;box-shadow:0 1px 4px rgba(70,50,140,.2);white-space:nowrap}
.snd{white-space:nowrap;font:800 12px var(--body);color:#fff;background:linear-gradient(135deg,var(--hot),#8a3dff);border:0;border-radius:999px;padding:7px 12px;cursor:pointer;box-shadow:0 0 14px #ff3d7f88}
.snd.off{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(70,50,140,.2)}
.snd:focus-visible,.btn:focus-visible,.c:focus-visible,.back:focus-visible,.acebtn:focus-visible,.gk button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.side{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink);font-weight:800;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.side>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guard{display:flex;align-items:center;gap:6px}
.seal{flex:none;width:16px;height:16px;border-radius:50%;background:var(--sealc);box-shadow:0 0 0 2px #fff6}
.wins{font-family:var(--num);font-size:16px;letter-spacing:4px;flex:none}
.wins i{font-style:normal;color:var(--off)} .wins i.on{color:var(--gold);text-shadow:0 0 6px #ffd23a}
.hand{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
/* カード：図鑑の小さな絵があればそれを、無ければ（あいて・おためし）属性の色と印で描く。パワーは下に大きく重ねる */
.c{aspect-ratio:180/276;max-width:100%;border-radius:8px;background:var(--tc);border:0;padding:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  font:inherit;position:relative;cursor:pointer;overflow:visible;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.35);transition:transform .15s,opacity .2s}
.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}
.c .i{position:relative;font-size:clamp(14px,4.6vw,20px);margin-top:6px}
.c .n{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:8px;opacity:.9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.c .p{position:relative;font-family:var(--num);font-size:clamp(11px,3.4vw,14px);margin:0 0 3px;line-height:1.2;text-shadow:0 1px 2px #0008}
.c.th .p{margin-top:auto;background:rgba(26,26,46,.78);border-radius:6px;padding:0 4px}
.c.used{opacity:.18;filter:grayscale(1);pointer-events:none}
.c.sel{transform:translateY(-10px) scale(1.05);box-shadow:0 0 0 3px var(--cool),0 0 18px var(--cool)}
.c.ace::after{content:'★';position:absolute;top:-6px;right:-5px;background:var(--gold);color:#5a3a00;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:1}
.opp .c{cursor:default}
.field{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(3px);display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center;padding:10px;position:relative;overflow:hidden}
.round{position:absolute;top:8px;left:12px;font-family:var(--display);font-size:13px;color:var(--gold)}
.zone{display:flex;gap:6px;min-height:76px;align-items:center;justify-content:center}
.zone .c{width:50px;cursor:default}
.zone.last{opacity:.45}
.fback{width:56px;height:84px;border-radius:10px;background:repeating-linear-gradient(45deg,#2a2160 0 6px,#352a7a 6px 12px);display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 #2a216099,0 0 20px #8a3dff66;animation:bob 1.6s ease-in-out infinite}
.fback b{width:30px;height:30px;border-radius:50%;background:var(--sealc);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 0 3px #fff7}
@keyframes bob{50%{transform:translateY(-4px)}}
.mid{text-align:center;font-size:12px;color:var(--dim);line-height:1.5;min-height:38px}
.mid .hash{font-family:var(--num);font-size:10px;color:#0a7fb0;letter-spacing:.05em}
.verdict{font-family:var(--display);font-size:30px;line-height:1.1}
.verdict.win{color:var(--gold);text-shadow:0 2px 0 #fff,0 0 16px #ffd23a} .verdict.lose{color:#7d78a8} .verdict.draw{color:var(--cool)}
.score{font-family:var(--num);font-size:22px}
.midscore{font-family:var(--num);font-size:26px;color:var(--ink);line-height:1.1}
.midscore small{font:800 11px var(--body);color:var(--dim);margin:0 6px}
.preview{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12px;min-height:40px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.preview b{font-family:var(--num);font-size:24px;color:var(--cool)}
.chip{background:#fff1d6;color:#b45d00;border-radius:999px;padding:1px 8px;font-weight:800;font-size:11px}
.chip.neg{background:#ecebf7;color:#5d5888}
.hist{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px;font-weight:800;color:var(--dim)}
.hist .h{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:2px 9px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.hist .h.win{background:#fff4d1;border-color:#ffc94a} .hist .h.lose{background:#ecebf7} .hist .h b{font-family:var(--num);font-size:12px}
.btn{font:800 16px var(--body);color:#fff;border:0;border-radius:14px;padding:13px;cursor:pointer;background:linear-gradient(135deg,var(--hot),#8a3dff);box-shadow:0 0 22px #ff3d7f77;text-decoration:none;text-align:center;display:block}
.btn:disabled{background:var(--off);box-shadow:none;color:var(--dim);cursor:default}
.btn.video{background:linear-gradient(135deg,#ff3d3d,#ff7a3d);box-shadow:0 4px 14px #ff5a3d55}
.btn.start{background:linear-gradient(135deg,#0a9fd8,#5a6cf0);box-shadow:0 4px 14px #3d8bff55}
.btn.sub2{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.thanks{background:linear-gradient(135deg,#1fd6a0,#0b8f86);box-shadow:0 0 22px #1fd6a077;line-height:1.5;font-size:15px}
.btn.ghost{background:none;box-shadow:none;color:var(--dim);font-size:12px;text-decoration:underline;padding:4px}
.btn:disabled,.btn.start:disabled,.btn.sub2:disabled{background:var(--off);box-shadow:none;color:var(--dim);border-color:transparent;cursor:default}
.note{font-size:10px;color:var(--dim);text-align:center}
/* はじめのルール画面・7枚えらぶ画面：重ねて出す */
.intro,.deck{position:fixed;inset:0;z-index:7;overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.deck{background:linear-gradient(180deg,#7fd0ff 0%,#bfe8ff 55%,#ffe9f4 100%);padding-top:max(12px,env(safe-area-inset-top,0px))}
.ibox{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(70,50,140,.18)}
.ibox h1{margin:0;font-family:var(--display);font-size:24px;text-align:center;background:linear-gradient(90deg,#ff9d00,#ff3d7f,#0a9fd8);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.ilead{margin:0;text-align:center;font-size:13px;color:var(--dim);font-weight:800}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.55}
.rules li b.n{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ffb800,#ff5e3a);color:#fff;font-family:var(--num);display:flex;align-items:center;justify-content:center;font-size:14px}
.rules li span{min-width:0} .rules em{font-style:normal;color:#d9480f;font-weight:800}
.tip{font-size:12px;background:#fff4d1;border:1px solid #ffc94a;border-radius:12px;padding:8px 12px;line-height:1.55}
.gnote{font-size:12px;background:#e6fbf3;border:1px solid #8fe3c4;border-radius:12px;padding:8px 12px;line-height:1.55}
.ibtns{display:flex;flex-direction:column;gap:8px}
.dbox{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.dpanel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:8px}
.dpanel h2{margin:0;font-family:var(--display);font-size:18px;color:var(--ink)}
.dpanel h3{margin:0;font-size:12px;color:var(--dim);font-weight:800;letter-spacing:.04em}
.dpanel.dtop{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.95)}
/* はじめの画面・7枚えらぶ画面・終わりの画面にも「図鑑へ」（上の帯はこれらの画面に隠れるため） */
.iback{align-self:flex-start;display:inline-block;width:max-content}
.sheet .back{align-self:center;font-size:13px;padding:8px 16px}
.picked{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.slot7{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.slot7 .empty{aspect-ratio:180/276;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px}
.acebtn{font:800 clamp(8px,2.4vw,10px) var(--body);border:1px solid var(--line);background:#fff;color:var(--dim);border-radius:999px;padding:2px 0;cursor:pointer;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.acebtn.on{background:var(--gold);color:#5a3a00;border-color:transparent}
.acebtn:disabled{opacity:.4;cursor:default}
.meter{height:12px;border-radius:999px;background:var(--off);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3dd68c,#0a9fd8);transition:width .2s}
.meter.bad i{background:linear-gradient(90deg,#ff7a45,#ff3d3d)}
.mline{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--ink)} .mline b{font-family:var(--num);font-size:16px}
.mline.bad{color:#d6336c}
.zukan{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 6px}
.zc{position:relative}
.zc .c{width:100%}
.zc .tag{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font:800 8px var(--body);background:#2a1f4d;color:#fff;border-radius:999px;padding:0 5px;white-space:nowrap;z-index:1}
.zc .tag.gold{background:#ffb800;color:#5a3a00} .zc .tag.silver{background:#c9d1dc;color:#2a1f4d} .zc .tag.bug{background:#00b894}
.zc.on .c{box-shadow:0 0 0 3px var(--cool),0 0 12px var(--cool)} .zc.on::after{content:attr(data-n);position:absolute;top:-6px;left:-5px;width:18px;height:18px;border-radius:50%;background:var(--cool);color:#fff;font:800 11px var(--num);display:flex;align-items:center;justify-content:center;z-index:2}
.guards{display:flex;flex-direction:column;gap:6px}
.gk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gk .gm{height:8px;grid-column:1/-1}
.gk .gn{padding:0 12px 8px;font-weight:800;font-size:14px;color:var(--ink);min-width:0;overflow-wrap:anywhere} .gk .gn small{display:block;font-size:10px;color:var(--dim);font-weight:500}
.gk button{margin:0 10px 8px 0;font:800 12px var(--body);border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.gk button.on{background:linear-gradient(135deg,#1fd6a0,#0b8f86);color:#fff;border-color:transparent}
.drow{display:flex;gap:8px}
.drow .btn{flex:1}
.dmsg{font-size:12px;text-align:center;color:var(--dim);font-weight:800;min-height:18px}
.dmsg.warn{color:#d6336c}
.few{display:flex;flex-direction:column;gap:8px;text-align:center;font-size:13px;font-weight:800}
/* カードを開く場面：2人のカードだけを大きく映す */
.rv{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 50%,#fffef2 0,#fff3b0 22%,#7fd0ff 70%,#4aa8ff 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rv .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 8deg,rgba(255,255,255,0) 8deg 20deg);animation:spin 12s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.rvrow{position:relative;display:flex;gap:10px;justify-content:center;min-height:clamp(120px,37vw,175px)}
.rvwho{position:relative;font:800 14px var(--body);color:var(--ink);background:rgba(255,255,255,.85);border-radius:999px;padding:3px 14px}
.vs{position:relative;font-family:var(--display);font-size:44px;color:#ff3d7f;text-shadow:0 3px 0 #fff,0 0 18px #ff3d7f88;letter-spacing:.05em}
.bc{width:clamp(80px,25vw,116px);aspect-ratio:180/276;border-radius:12px;background:var(--tc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;
  box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 0 0 3px rgba(255,255,255,.5),0 0 30px rgba(255,255,255,.8)}
.bc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px}
.bc .bi{position:relative;font-size:clamp(30px,10vw,46px);margin-top:12%} .bc .bn{position:relative;font-size:12px;font-weight:800;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.bc .bp{position:relative;font-family:var(--num);font-size:clamp(20px,6.4vw,30px);margin-bottom:6%;text-shadow:0 2px 3px #0007}
.bc.th .bp{margin-top:auto;background:rgba(26,26,46,.78);border-radius:8px;padding:0 6px}
.bc.ace::after{content:'★';position:absolute;top:-8px;right:-7px;background:var(--gold);color:#5a3a00;border-radius:50%;width:24px;height:24px;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:1}
.bc.bk{background:repeating-linear-gradient(45deg,#2a2160 0 8px,#352a7a 8px 16px);align-items:center;justify-content:center;animation:shake .12s linear infinite}
.bc.bk b{width:44px;height:44px;border-radius:50%;background:var(--sealc);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 0 3px #fff8}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-1deg)}75%{transform:translate(2px,-1px) rotate(1deg)}}
.bc.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:rotateY(90deg) scale(.5)}to{transform:none}}
.rvsum{position:relative;min-height:26px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--ink)}
.rvsum b{font-family:var(--num);font-size:30px;color:var(--ink);text-shadow:0 2px 0 #fff}
.rvres{position:relative;font-family:var(--display);font-size:46px;min-height:56px;line-height:1.1}
.rvres.win{color:var(--gold);text-shadow:0 3px 0 #fff,0 0 22px #ffd23a} .rvres.lose{color:#6b66a0;text-shadow:0 3px 0 #fff} .rvres.draw{color:var(--cool);text-shadow:0 3px 0 #fff}
.rvtap{position:relative;font:800 13px var(--body);color:var(--ink);background:rgba(255,255,255,.9);border-radius:999px;padding:5px 16px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out both;pointer-events:none}
@keyframes flash{from{opacity:1}to{opacity:0}}
/* エースが出た回は別の場面：暗い背景に金の光が速く回る。エース同士は虹色に流れて、稲妻のように光る */
.rv.ace1{background:radial-gradient(circle at 50% 45%,#fff3b0 0,#ffb020 18%,#c2185b 58%,#2a0a3d 100%)}
.rv.ace1 .rays{background:repeating-conic-gradient(from 0deg,rgba(255,215,64,.5) 0 6deg,rgba(255,215,64,0) 6deg 15deg);animation-duration:3s}
.rv.ace2{background:linear-gradient(120deg,#ff004c,#ff9f00,#ffe600,#00e5ff,#7a00ff,#ff004c,#ff9f00);background-size:300% 100%;animation:flow 1.6s linear infinite}
@keyframes flow{to{background-position:150% 0}}
.rv.ace2 .rays{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.7) 0 4deg,rgba(255,255,255,0) 4deg 10deg);animation-duration:1.2s}
.rv.ace2::before{content:'';position:absolute;inset:0;background:#fff;opacity:0;animation:strobe 1.1s steps(1) infinite;pointer-events:none}
@keyframes strobe{0%{opacity:0}8%{opacity:.55}12%{opacity:0}20%{opacity:.35}24%{opacity:0}}
.rv.ace1 .rvsum,.rv.ace2 .rvsum{color:#fff;text-shadow:0 1px 3px #000a}
.rv.ace1 .rvsum b,.rv.ace2 .rvsum b{color:#fff;text-shadow:0 0 14px #ffd23a,0 2px 0 #000}
.rv.ace1 .rvres.lose,.rv.ace2 .rvres.lose{color:#e8e4ff;text-shadow:0 3px 0 #000}
.rv.ace1 .bc.ace,.rv.ace2 .bc.ace{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both,aura 1s ease-in-out .55s infinite}
@keyframes aura{50%{box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 0 0 3px #ffd23a,0 0 50px 14px #ffd23a}}
.rv.quake{animation:quake .5s linear}
.rv.ace2.quake{animation:flow 1.6s linear infinite,quake .5s linear}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
.acein{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none}
.acein .band{font-family:var(--display);font-size:clamp(34px,11vw,64px);line-height:1.15;color:#fff;-webkit-text-stroke:2px #5a1200;text-shadow:0 4px 0 #5a1200,0 0 30px #ffd23a;white-space:nowrap;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.6) 15%,rgba(0,0,0,.6) 85%,transparent);padding:4px 48px;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(3) rotate(-10deg);opacity:0}to{transform:rotate(-4deg);opacity:1}}
.acein .who{font:900 15px var(--body);color:#fff;background:rgba(0,0,0,.6);border-radius:999px;padding:3px 14px;animation:slam .5s .25s cubic-bezier(.2,1.6,.4,1) both}
.acein .acecards{display:flex;gap:10px;align-items:center;justify-content:center}
.acein .bc{width:clamp(130px,40vw,190px);animation:zoomin .6s .15s cubic-bezier(.2,1.4,.4,1) both,aura 1s ease-in-out .75s infinite}
.acein .bc::before{content:'';position:absolute;inset:0;z-index:1;border-radius:12px;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%) no-repeat;background-size:250% 100%;animation:shine 1.3s .6s ease-in-out infinite}
@keyframes zoomin{from{transform:scale(4) rotate(20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.acein .duel .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.acein .duel .who{font-size:12px;padding:2px 10px;white-space:nowrap}
.acein .duel .bc{width:clamp(86px,26vw,150px)}
.rv.cut>:not(.acein):not(.rays){visibility:hidden}
.acein .duel .l .bc{animation:flyl .75s cubic-bezier(.5,0,.6,1.4) both,aura .6s ease-in-out .75s infinite}
.acein .duel .r .bc{animation:flyr .75s cubic-bezier(.5,0,.6,1.4) both,aura .6s ease-in-out .75s infinite}
@keyframes flyl{from{transform:translateX(-110vw) rotate(-40deg)}to{transform:none}}
@keyframes flyr{from{transform:translateX(110vw) rotate(40deg)}to{transform:none}}
.acein .zap{font-size:clamp(34px,11vw,72px);filter:drop-shadow(0 0 16px #fff);animation:zap .4s .7s steps(2) both infinite}
@keyframes zap{from{transform:scale(1.4) rotate(-12deg)}to{transform:scale(1) rotate(12deg)}}
.aceback{display:inline-block;margin-top:3px;font-size:11px;font-weight:900;color:#7a4a00;background:#ffe28a;border-radius:999px;padding:1px 10px}
/* 終わりの画面 */
.over{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(120,190,255,.35);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:center;backdrop-filter:blur(8px);max-height:94%;overflow:auto}
.big{font-family:var(--display);font-size:34px}
.log{font-size:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.log div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:3px 0}
.lbl{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.06em}
.gcard{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.gcard .map{height:46px;background:linear-gradient(90deg,#f6a57a,#e76f51,#f4c48a,#9ad0c2,#f6a57a)}
.gcard .nm{font-weight:800;font-size:17px;margin-top:8px} .gcard .sub{font-size:11px;color:var(--dim);margin-bottom:8px}
.warn{font-size:11px;color:var(--dim)}
.vmodal{position:fixed;inset:0;z-index:8;background:rgba(20,16,48,.6);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vbox{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center;color:var(--ink)}
.vframe{display:block;width:min(100%,calc(62vh * 9 / 16));aspect-ratio:9/16;margin:0 auto;border:0;border-radius:12px;background:#000}
@media (prefers-reduced-motion:reduce){.rv .rays,.bc.bk,.bc.pop,.fback,.rv.ace2,.rv.ace2::before,.rv.quake,.acein *,.rv .bc.ace{animation:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <div class="top"><span class="logo" data-i18n="bLogo">モンスター対戦</span><span class="topr"><a class="back" href="monster.html" data-i18n="bBack">← 図鑑へ</a><button class="snd off" id="snd" type="button" data-i18n="bSndOn">♪ 音を出す</button></span></div>
  <div class="side"><span id="oppName">あいて：ゆうと</span><span class="guard" style="--sealc:linear-gradient(135deg,#f6a57a,#e76f51)"><span class="seal"></span><span id="oppWitness">立会人 アナ・リマさん</span></span><span class="wins" id="ow"></span></div>

  <div class="field" id="field">
    <span class="round" id="rnd">1回目</span>
    <div class="zone" id="oz"></div>
    <div class="mid" id="mid"></div>
    <div class="zone" id="mz"></div>
  </div>
  <div class="hist" id="hist"></div>
  <div class="preview" id="pv"></div>
  <div class="side"><span data-i18n="bYou">あなた</span><span class="guard"><span class="seal" id="myseal"></span><span id="myguard"></span></span><span class="wins" id="mw"></span></div>
  <div class="hand" id="mh"></div>
  <button class="btn" id="go" type="button" disabled data-i18n="bGo">伏せて出す</button>
  <div class="note" id="trialNote" hidden data-i18n="bTrialNote">おためしのカードです（図鑑には入りません）</div>
</div>

<div class="intro" id="intro">
 <div class="ibox">
  <a class="back iback" href="monster.html" data-i18n="bBack">← 図鑑へ</a>
  <h1 data-i18n="bIntroH">モンスター対戦のあそびかた</h1>
  <p class="ilead" data-i18n="bIntroLead">図鑑のモンスターで、1対1の勝負</p>
  <ol class="rules">
   <li><b class="n">1</b><span id="rule1"></span></li>
   <li><b class="n">2</b><span data-i18n="bRule2" data-i18n-html></span></li>
   <li><b class="n">3</b><span data-i18n="bRule3" data-i18n-html></span></li>
   <li><b class="n">4</b><span data-i18n="bRule4" data-i18n-html></span></li>
   <li><b class="n">5</b><span data-i18n="bRule5" data-i18n-html></span></li>
   <li><b class="n">6</b><span data-i18n="bRule6" data-i18n-html></span></li>
  </ol>
  <div class="tip" data-i18n="bTip" data-i18n-html></div>
  <div class="gnote" data-i18n="bGuardNote"></div>
  <div class="ibtns">
   <!-- 動画は YouTube に上げてから出す（VIDEO_ID が空のあいだは隠す。押すまで YouTube と通信しない） -->
   <button class="btn video" id="vbtn" type="button" hidden data-i18n="bVideo">▶ 動画で見る（対戦しながら説明）</button>
   <button class="btn start" id="startbtn" type="button" data-i18n="bStart">対戦をはじめる</button>
  </div>
  <div class="note" data-i18n="bNote"></div>
 </div>
</div>

<div class="deck" id="deck" hidden>
 <div class="dbox">
  <div class="dpanel dtop">
   <a class="back iback" href="monster.html" data-i18n="bBack">← 図鑑へ</a>
   <h2 data-i18n="bDeckH">図鑑から7枚えらぶ</h2>
   <div class="picked" id="picked"></div>
   <div class="mline" id="mline"><span id="msumLbl"></span><span><b id="msum">0</b> ／ <span id="mcap"></span></span></div>
   <div class="meter" id="meter"><i id="mbar" style="width:0"></i></div>
  </div>
  <div class="dpanel" id="zpanel">
   <h3 data-i18n="bZukanH">あなたの図鑑（タップで入れる・外す）</h3>
   <div class="zukan" id="zukan"></div>
   <div class="few" id="few" hidden><span id="fewMsg"></span><a class="btn start" href="monster.html" data-i18n="bFewMake">モンスターを生みに行く</a><button class="btn sub2" id="trial" type="button" data-i18n="bTrial">おためしのカードで遊ぶ</button></div>
  </div>
  <div class="dpanel">
   <h3 data-i18n="bGuardH">守り神（人間のカード）は戦いません。1枚を立会人にできます</h3>

  </div>
  <div class="dmsg" id="dmsg"></div>
  <div class="drow"><button class="btn sub2" id="auto" type="button" data-i18n="bAuto">おまかせで選ぶ</button><button class="btn start" id="todeck" type="button" disabled data-i18n="bToBattle">対戦へ</button></div>
 </div>
</div>

<div class="vmodal" id="vmodal" hidden><div class="vbox">
 <div id="vslot"></div>
 <button class="btn start" id="vclose" type="button" data-i18n="bClose">閉じる</button>
</div></div>
